name: "Generic"
description: "Generic Slurm environment that should work on any cluster running Slurm. Shared create/manage pages, common Slurm parameters, module picker, workflow actions (rerun/cancel), job/node picker, a Job Resources card (sstat/seff, CPU/GPU monitoring charts, processes) and logs."
category: "General"
version: "3.1.0"
author: "Marinus Pennings"
requires_drona: ">=2.0"
